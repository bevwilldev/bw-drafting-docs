# Keeps the generated search data in step with the hand-written pages.
#
# WHY THIS EXISTS. Three files on this site are generated, not written:
#   assets/js/commands.js       the command library + the index table
#   assets/data/corpus.json     the site chopped into sections — Caddie's reading
#   assets/data/corpus-vectors.json  those sections as embeddings
# They used to be regenerated by hand before a release, and the failure mode was
# silent and bad: edit a page, forget the scripts, and Caddie confidently tells
# a drafter the new command does not exist. Worse than saying nothing. This job
# runs them on every push so forgetting is no longer possible.
#
# LOOP SAFETY, two ways: this job commits with [skip ci], and pushes made with
# GITHUB_TOKEN do not trigger workflows in the first place.
#
# THE EMBEDDING STEP IS OPTIONAL. gen_vectors.py needs GEMINI_API_KEY, added as
# a repository secret (Settings -> Secrets and variables -> Actions). Without it
# the job still regenerates the command library and the corpus, and says the
# vectors were skipped. That is a DEGRADED but safe state: the Worker checks the
# corpus fingerprint, sees the vectors no longer match, and falls back to
# keyword search rather than answering from stale embeddings.
#
# COST. Embedding is incremental — unchanged sections are reused via per-section
# hashes — so an ordinary docs edit costs a handful of requests out of the
# 1,000/day free allowance, not 310.

name: rebuild-search

on:
  push:
    branches: [main]
    # Don't re-run for a push that only changed what this job itself writes.
    paths-ignore:
      - 'assets/js/commands.js'
      - 'assets/data/corpus.json'
      - 'assets/data/corpus-vectors.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The generators are standard-library only — nothing to install.

      # ORDER MATTERS: this rewrites commands/index.html, which the corpus then
      # reads. Run it second and the corpus captures the previous command list.
      - name: Command library
        run: python scripts/gen_command_library.py

      - name: Corpus
        run: python scripts/gen_corpus.py

      - name: Vectors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret not set - skipping embeddings."
            echo "::warning::Caddie will use keyword search until the vectors are regenerated."
            exit 0
          fi
          python scripts/gen_vectors.py

      - name: Commit whatever changed
        run: |
          git config user.name  "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git add assets/js/commands.js assets/data/corpus.json \
                  assets/data/corpus-vectors.json commands/index.html
          if git diff --cached --quiet; then
            echo "Search data already current - nothing to commit."
          else
            git commit -m "Rebuild command library, corpus and vectors [skip ci]"
            git push
          fi
