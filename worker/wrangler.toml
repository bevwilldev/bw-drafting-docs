# Cloudflare Worker — the assistant endpoint.
#
# As configured there is NO API KEY anywhere: the model runs on Cloudflare via
# the AI binding below. If you ever switch to a paid provider, the key is set
# once with
#   wrangler secret put API_KEY
# which stores it with Cloudflare, never in this file and never in the repo.

name = "bw-cad-hub-assistant"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Workers AI. This binding is what makes env.AI.run() work; without it the
# Worker deploys fine and fails on the first question.
[ai]
binding = "AI"

[vars]
# Which backend. One of:
#   "gemini"            Google, key in the API_KEY secret
#   "workers-ai"        Cloudflare's own models, no key (the AI binding above)
#   "openai-compatible" OpenAI, Groq OR Anthropic — they share a wire format,
#                       so it is BASE_URL + an API_KEY secret. For Claude Haiku:
#                         BASE_URL = "https://api.anthropic.com/v1"
#                         MODEL    = "claude-haiku-4-5-20251001"
PROVIDER = "gemini"

# Gemini 2.5 Flash: strong instruction-following for roughly $2/month at this
# volume. Workers AI was the free starting point but had to be talked out of
# inventing command limitations, which is the one thing this must never do.
MODEL = "gemini-2.5-flash"

# Documentation sections sent per question. 0 = the whole corpus (~28k tokens),
# which Gemini has room for and which removes retrieval — and therefore every
# "the right section did not rank high enough" failure — as a concept.
#
# Left at 40 because it was MEASURED as sufficient: replaying the real corpus
# against twelve realistic questions, the answering section made the top 40
# every time (ALAB, the worst, ranks 19th). 0 costs about 5x more per question
# for insurance against a failure not yet observed at 40. Raise it if one turns
# up. See the long note in src/index.js.
SECTIONS = 40

# Keep the free tier honest: no analytics engine, no KV, no durable objects.
# This Worker holds no state that matters between requests.
