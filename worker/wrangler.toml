# Cloudflare Worker — the assistant endpoint.
#
# As configured there is NO API KEY anywhere: the model runs on Cloudflare via
# the AI binding below. If you ever switch to a paid provider, the key is set
# once with
#   wrangler secret put API_KEY
# which stores it with Cloudflare, never in this file and never in the repo.

name = "bw-cad-hub-assistant"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Workers AI. This binding is what makes env.AI.run() work; without it the
# Worker deploys fine and fails on the first question.
[ai]
binding = "AI"

[vars]
# "workers-ai" (default) or "openai-compatible" — the latter covers both
# OpenAI and Groq, which share a wire format, via BASE_URL + an API_KEY secret.
PROVIDER = "workers-ai"

# Which model. Verify against `wrangler ai models` rather than trusting a
# name from memory — the catalogue changes and near-misses exist (there is an
# @cf/meta/llama-3.1-8b-instruct-fp8 but no plain -instruct, which is exactly
# the mistake that made the first deploy fail).
#
# 70B rather than the 8B first tried: this answers from supplied documentation,
# where following "only use these sections, never invent a command" matters
# more than raw speed, and -fast keeps it responsive.
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Documentation sections sent per question. 0 = the whole corpus, which is
# better but needs a big context window; see the long note in src/index.js
# before changing it.
SECTIONS = 40

# Keep the free tier honest: no analytics engine, no KV, no durable objects.
# This Worker holds no state that matters between requests.
