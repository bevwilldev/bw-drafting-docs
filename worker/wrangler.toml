# Cloudflare Worker — the assistant endpoint.
#
# The API key is NOT in this file and must never be. It is set once with
#   wrangler secret put API_KEY
# which stores it with Cloudflare, not in the repo.

name = "bw-cad-hub-assistant"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Which backend. One of:
#   "gemini"            Google, key in the API_KEY secret
#   "openai-compatible" OpenAI, Groq OR Anthropic — they share a wire format,
#                       so it is BASE_URL + an API_KEY secret. For Claude Haiku:
#                         BASE_URL = "https://api.anthropic.com/v1"
#                         MODEL    = "claude-haiku-4-5-20251001"
PROVIDER = "gemini"

# THE FALLBACK CHAIN, best model first. Free-tier quota is metered PER MODEL PER
# DAY, so several models is how you get a usable daily allowance: the full Flash
# models give 20 requests a day EACH and the Lite ones 500, which is about 1,060
# a day here against 500 from any single model.
#
# Ordered by quality, not by quota, deliberately. Each question takes the best
# model that still has requests left and drops to the next on a 429, so the
# first sixty questions of the day get full Flash and the rest get Lite. That is
# the right way round: the big allowances are the reserve tank.
#
# NOT the 2.5 pair, though the AI Studio quota page lists them with allowances.
# They 404 with "no longer available to new users" on a key created today — the
# quota page shows what the ACCOUNT is entitled to, not what the KEY may call.
# Probe a model before adding it here.
MODELS = "gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-3.1-flash-lite"

# Documentation sections sent per question. 0 = the whole corpus (~29k tokens).
#
# 12, down from 40, because retrieval is now SEMANTIC. Measured over 17 real
# questions, the section that answers them ranked worst-case 18th under keyword
# scoring and worst-case 3rd under embeddings — so the wide net was insurance
# against a problem that no longer exists. Twelve is 4x the observed worst case
# and hands the model ~1.2k tokens of relevant material instead of ~3.9k mostly
# irrelevant. See the long note in src/index.js.
SECTIONS = 12

# WHAT PEOPLE ASK, and nothing else. This is the one piece of state the Worker
# keeps, and it exists to improve the DOCUMENTATION rather than to measure
# anybody: the questions nobody can answer are the pages that are missing.
#
# Stored per entry: the question, the page they were on, how many sources came
# back, and whether somebody marked the answer wrong. NOT stored: IP, any
# header that identifies a person, or anything from a drawing. Entries expire
# by themselves after 90 days, so this cannot quietly become a permanent record.
#
# Read it with:  wrangler kv key list --binding ASK_LOG --remote
[[kv_namespaces]]
binding = "ASK_LOG"
id = "01dfb5474fcd4da3b73207e3e621928d"

# NO RATE LIMIT BINDING, and no WAF rule — both were tried and neither enforced
# (the measurements are in src/index.js). They were removed rather than left in
# place, because config that looks like protection and is not is worse than
# none. Google's own per-minute and per-day quotas are the limit today, and the
# key cannot be billed, so a loop costs nothing but a quiet afternoon.
#
# Otherwise the free tier stays honest: no Workers AI binding (that provider is
# gone), no analytics engine, no durable objects.
