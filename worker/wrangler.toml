# Cloudflare Worker — the assistant endpoint.
#
# As configured there is NO API KEY anywhere: the model runs on Cloudflare via
# the AI binding below. If you ever switch to a paid provider, the key is set
# once with
#   wrangler secret put API_KEY
# which stores it with Cloudflare, never in this file and never in the repo.

name = "bw-cad-hub-assistant"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Workers AI. This binding is what makes env.AI.run() work; without it the
# Worker deploys fine and fails on the first question.
[ai]
binding = "AI"

[vars]
# Which backend. One of:
#   "gemini"            Google, key in the API_KEY secret
#   "workers-ai"        Cloudflare's own models, no key (the AI binding above)
#   "openai-compatible" OpenAI, Groq OR Anthropic — they share a wire format,
#                       so it is BASE_URL + an API_KEY secret. For Claude Haiku:
#                         BASE_URL = "https://api.anthropic.com/v1"
#                         MODEL    = "claude-haiku-4-5-20251001"
PROVIDER = "gemini"

# Roughly $2/month at this volume ($0.30 in / $2.50 out per MTok). Workers AI
# was the free starting point but had to be talked out of inventing command
# limitations, which is the one thing this must never do.
#
# NOT 2.5 — the entire 2.5 generation returns 404 "no longer available to new
# users" on a key created today, whatever the model list says it contains. The
# list is not the same as what a key may call; probe before trusting it.
#
# WHY FLASH-LITE, AND WHAT IT COSTS YOU
# Free-tier quota is per model per day, and Lite's is generous where full Flash
# allows TWENTY requests a day — unusable for a team without billing. So this is
# the model you can actually pilot on for nothing.
#
# The trade is real and worth knowing before anyone relies on it. Asked "how do
# I label lot areas" it answered that the documentation has no dedicated area
# labelling command — ALAB, which was in the sections it was handed and which it
# used correctly on the very next question. It invents no command NAMES (every
# one it offered checks out in the source), but it will occasionally tell
# somebody a thing cannot be done when it can, which for a tool meant to reduce
# support load quietly generates support.
#
# Full gemini-3.6-flash / gemini-3.5-flash get this right. So does Claude Haiku
# 4.5, which at ~$6/month is CHEAPER than 3.5-flash at ~$9.45. Move to one of
# those before this is the official answer to "how do I do X".
MODEL = "gemini-3.5-flash-lite"

# Documentation sections sent per question. 0 = the whole corpus (~28k tokens),
# which Gemini has room for and which removes retrieval — and therefore every
# "the right section did not rank high enough" failure — as a concept.
#
# Left at 40 because it was MEASURED as sufficient: replaying the real corpus
# against twelve realistic questions, the answering section made the top 40
# every time (ALAB, the worst, ranks 19th). 0 costs about 5x more per question
# for insurance against a failure not yet observed at 40. Raise it if one turns
# up. See the long note in src/index.js.
SECTIONS = 40

# WHAT PEOPLE ASK, and nothing else. This is the one piece of state the Worker
# keeps, and it exists to improve the DOCUMENTATION rather than to measure
# anybody: the questions nobody can answer are the pages that are missing.
#
# Stored per entry: the question, the page they were on, how many sources came
# back, and whether somebody marked the answer wrong. NOT stored: IP, any
# header that identifies a person, or anything from a drawing. Entries expire
# by themselves after 90 days, so this cannot quietly become a permanent record.
#
# Read it with:  wrangler kv key list --binding ASK_LOG --remote
[[kv_namespaces]]
binding = "ASK_LOG"
id = "01dfb5474fcd4da3b73207e3e621928d"

# Otherwise the free tier stays honest: no analytics engine, no durable objects.
